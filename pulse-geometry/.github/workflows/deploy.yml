# Deploy Pulse Geometry to Cloudflare Pages on every push to `main`.
#
# One-time setup: create a Cloudflare API token (My Profile -> API Tokens ->
# Create Token -> "Edit Cloudflare Workers" template or a custom token with
# Account: Cloudflare Pages: Edit + Account: Workers Scripts: Edit) and store
# it as a repo secret:
#
#   gh secret set CLOUDFLARE_API_TOKEN --repo brycejensen540/shapes
#
# The build settings mirror wrangler.toml at the repo root
# (pages_build_output_dir = "dist").

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=pulse-geometry --branch=main
