# Cloudflare Pages configuration for Pulse Geometry.
# `pages_build_output_dir` is the modern key the Pages Git integration (and
# the deploy workflow in .github/workflows/deploy.yml) reads to find the
# built site. It is also picked up by `wrangler pages deploy`.
name = "pulse-geometry"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"
